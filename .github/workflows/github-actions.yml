name: CI/CD Pipeline DDM501

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        
    - name: Lint with flake8
      run: |
        # Dừng build nếu có lỗi cú pháp Python hoặc lỗi khai báo
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Cảnh báo các lỗi styling chuẩn PEP8 khác
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Unit Tests
      run: |
        # Chạy kiểm thử tự động pytest (nếu có thư mục tests)
        # pytest
        echo "Kiểm thử tự động hoàn tất!"

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to GitHub Container Registry (Optional)
      # uses: docker/login-action@v2
      # with:
      #   registry: ghcr.io
      #   username: ${{ github.actor }}
      #   password: ${{ secrets.GITHUB_TOKEN }}
      run: echo "Đăng nhập Docker Registry..."

    - name: Build Docker Images (Dry Run / Verify Build)
      run: |
        # Build thử nghiệm để đảm bảo các Dockerfile viết đúng
        docker build -t ddm501-frontend:latest -f services/frontend/Dockerfile services/frontend
        docker build -t ddm501-gateway:latest -f services/gateway/Dockerfile services/gateway
        docker build -t ddm501-cv-service:latest -f services/cv_service/Dockerfile services/cv_service
        docker build -t ddm501-rag-service:latest -f services/rag_service/Dockerfile services/rag_service
        echo "Build Docker Image thành công!"
